
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101820">
  <meta name="description" content="RealWorldBattleZone 3D mobile game prototype">
  <link rel="manifest" href="/RealWorldBattleZone/manifest.webmanifest">
  <link rel="icon" href="/RealWorldBattleZone/icon.svg" type="image/svg+xml">
  <title>RealWorldBattleZone</title>
  <script type="module" crossorigin src="/RealWorldBattleZone/assets/index-DIlJ2KXE.js"></script>
  <link rel="stylesheet" crossorigin href="/RealWorldBattleZone/assets/index-dUr1fknm.css">
</head>
<body>
  <main id="game">

    <!-- Player HUD -->
    <div id="hud">
      <div class="game-title">REAL WORLD BATTLE ZONE</div>
      <div id="status">Loading game...</div>
      <div class="health-label">HP <span id="healthText">100 / 100</span></div>
      <div id="health"><div id="healthBar"></div></div>
    </div>

    <!-- Match information -->
    <div id="matchInfo">
      <div class="match-box">
        <span>ALIVE</span>
        <strong id="aliveCount">1</strong>
      </div>
      <div class="match-box">
        <span>MATCH</span>
        <strong id="matchTimer">00:00</strong>
      </div>
    </div>

    <!-- Compass -->
    <div id="compass">N　 NE　 E　 SE　 S</div>

    <!-- Mini map -->
    <div id="minimap" aria-label="Mini map"></div>

    <!-- Aim -->
    <div id="crosshair">＋</div>

    <!-- Existing controls -->
    <div id="controls-hint">Drag the screen to rotate camera</div>

    <div id="joystick" aria-label="Movement joystick">
      <div id="stick"></div>
    </div>

    <button id="jumpBtn" type="button">JUMP</button>

    <!-- New action controls -->
    <button id="fireBtn" type="button">FIRE</button>
    <button id="crouchBtn" type="button">CROUCH</button>

    <!-- Weapon slots -->
    <div id="weaponHUD">
      <button class="weapon-slot active" data-weapon="pistol">PISTOL</button>
      <button class="weapon-slot" data-weapon="rifle">RIFLE</button>
      <button class="weapon-slot" data-weapon="shotgun">SHOTGUN</button>
      <button class="weapon-slot" data-weapon="sniper">SNIPER</button>
    </div>

    <div id="ammoInfo">AMMO: <span id="ammoCount">30</span></div>

    <button id="installBtn" type="button" hidden>INSTALL APP</button>

  </main>

</body>
</html>
